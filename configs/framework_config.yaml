# AutoPentestFramework V2 配置文件
# LangChain + Ray 架构

# LangChain配置
langchain:
  llm:
    type: "openai"
    model: "gpt-4o-ca"  # 使用 llm_runtime.json 中的模型
    temperature: 0.7
    max_tokens: 2048
    # API Key 和 base_url 会自动从 llm_runtime.json 读取
  
  memory:
    type: "conversation_buffer_window"
    window_size: 10

# Ray配置
ray:
  num_cpus: 8
  num_gpus: 0
  object_store_memory: 2000000000  # 2GB
  dashboard_host: "127.0.0.1"
  dashboard_port: 8265

# Agent配置
agents:
  recon:
    safe_mode: true
    num_cpus: 1.0
    num_gpus: 0.0
    scan_timeout: 300
    max_ports: 1000
    stealth_mode: true
    llm:
      model: "gpt-4o-ca"
      temperature: 0.7
  
  weaponize:
    safe_mode: true
    num_cpus: 1.0
    num_gpus: 0.0
    llm:
      model: "gpt-4o-ca"
      temperature: 0.5
  
  delivery:
    safe_mode: true
    num_cpus: 0.5
    num_gpus: 0.0
  
  exploit:
    safe_mode: true
    num_cpus: 2.0
    num_gpus: 0.0
    max_concurrent: 3
    timeout: 600
  
  install:
    safe_mode: true
    num_cpus: 1.0
    num_gpus: 0.0
  
  c2:
    safe_mode: true
    num_cpus: 1.0
    num_gpus: 0.0
  
  objectives:
    safe_mode: true
    num_cpus: 1.0
    num_gpus: 0.0

# 执行配置
execution:
  parallel: false  # 是否启用并行执行
  max_parallel_agents: 3
  timeout: 3600  # 总超时时间（秒）
  auto_correction: true
  max_retry_attempts: 3

# 数据库配置
database:
  type: "sqlite"
  path: "pentest_events/pentest.db"

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/pentest_v2.log"

