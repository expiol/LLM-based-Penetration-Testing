runs_root: "runs"

logging:
  level: "INFO"

budget:
  max_steps: 24
  max_time_s: 1200
  max_tool_calls: 96

timeouts:
  command_timeout_s: 180
  command_retries: 1
  http_timeout_s: 6
  nmap_host_timeout_s: 30

http_probe_paths:
  - "/"
  - "/robots.txt"
  - "/api"

sqlmap_safe_flags:
  - "--batch"
  - "--risk=1"
  - "--level=1"
  - "--threads=1"
  - "--timeout=10"
  - "--retries=1"
  - "--flush-session"

nmap_ports: [80, 443, 3000, 8080]

report:
  template_path: "data/templates/report.md"

safety:
  allow_hosts:
    - "127.0.0.1"
    - "localhost"
    - "127.0.0.0/8"
  allow_scopes:
    - "local_lab"

plugins: []

random_seed: 7
