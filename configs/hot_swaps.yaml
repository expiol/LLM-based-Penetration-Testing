# 热更新配置文件
# 此文件中的配置可以在运行时动态更新，无需重启服务

defaults:
  # 日志配置
  logger:
    level: "INFO"
  
  # LLM请求配置
  llm:
    request:
      timeout: 600
      user_prompt_max: 3200
      analyze_72b_token_max: 6000
      analyze_7b_token_max: 4000
      generate_token_max: 2048
  
  # 渗透测试配置
  pentest:
    active_exploration: false
    safe_mode: true
    automated_payload_generation: true
    vuln_exploit_simulation: false
    trust_remote_scanner_results: true
    noise_reduction: true
    reasoning_interpretation: true
    reasoning_interpretation_model: "HengNao-r1"

# 环境特定配置
development:
  pentest:
    safe_mode: true
    active_exploration: false

staging:
  pentest:
    safe_mode: true
    active_exploration: false

production:
  pentest:
    safe_mode: true
    active_exploration: false
