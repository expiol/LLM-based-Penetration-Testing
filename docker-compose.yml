version: '3.8'

services:
  llm-pentest:
    build: .
    container_name: llm-pentest
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - SAFE_MODE=true
      - MODEL_SERVE_IP=host.docker.internal
      - MODEL_SERVE_PORT=8000
      - LOGGING_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
      - ./pentest_events:/app/pentest_events
      - ./configs:/app/configs
    networks:
      - pentest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 可选：添加数据库服务
  postgres:
    image: postgres:15
    container_name: pentest-db
    environment:
      - POSTGRES_DB=pentest
      - POSTGRES_USER=pentest
      - POSTGRES_PASSWORD=pentest123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pentest-network
    restart: unless-stopped

  # 可选：添加Redis缓存服务
  redis:
    image: redis:7-alpine
    container_name: pentest-redis
    networks:
      - pentest-network
    restart: unless-stopped

networks:
  pentest-network:
    driver: bridge

volumes:
  postgres_data:
