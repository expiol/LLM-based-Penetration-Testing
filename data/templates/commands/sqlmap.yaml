name: "sqlmap"
description: "SQL injection validation in safe mode"
example:
  argv:
    - "sqlmap"
    - "-u"
    - "http://127.0.0.1:8080/vulnerabilities/sqli/?id=1&Submit=Submit"
    - "--batch"
    - "--risk=1"
    - "--level=1"
    - "--threads=1"
    - "--timeout=10"
    - "--retries=1"
    - "--flush-session"
    - "--output-dir"
    - "runs/<run_id>/evidence/sqlmap"
