[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-based-penetration-testing"
version = "0.1"
authors = [
  { name="expiol" },
]
description = "LLM-driven structured killchain for CTF and authorized security assessment"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  "pathlib",
  "pydantic>=2",
  "openai",
  "anthropic",
  "rich",
  "pyyaml",
#  "bs4",
#  "jinja2",
  "docker",
  "tabulate",
  "backoff",
  "pyte",
  "tiktoken",
  "nyuctf",
  "together",
  "fastembed",
  "numpy",
]

[project.optional-dependencies]
test = [
  "pytest",
]

[project.urls]
Homepage = "https://github.com/expiol/LLM-based-Penetration-Testing"

[project.scripts]
autopentest = "killchain_docker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [
  ".git",
  ".venv",
  "logs*",
  "selftest_output",
  "leaderboard_submissions",
]

[tool.hatch.build.targets.wheel]
packages = ["killchain_docker"]
