[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nyuctf_multiagent"
version = "0.1"
authors = [
  { name="NYU CTF", email="nyuctf@gmail.com" },
  { name="Meet Udeshi", email="m.udeshi@nyu.edu" },
]
description = "LLM-driven structured killchain for CTF / security assessment (NYUCTF)"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
  "pathlib",
  "pydantic>=2",
  "openai",
  "instructor",
  "anthropic",
  "rich",
  "pyyaml",
#  "bs4",
#  "jinja2",
  "docker",
  "tabulate",
  "backoff",
  "pyte",
  "tiktoken",
  "nyuctf",
  "together",
  "fastembed",
  "numpy",
]

[project.urls]
Homepage = "https://nyu-llm-ctf.github.io"

[project.scripts]
autopentest = "killchain_docker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [
  ".git",
  ".venv",
  "logs*",
  "selftest_output",
  "leaderboard_submissions",
]

[tool.hatch.build.targets.wheel]
packages = ["killchain_docker"]
